  <style>
    :root {
      --page: #f4f4f4;
      --card: #ffffff;
      --text: #333333;
      --title: #182955;
      --muted: #999999;

      --link: #5778d8;

      --focus: #5778d8;
      --side-col: 300px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; align-items: flex-start; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.5; background: var(--page); color: var(--text);
    }
    button { font: inherit; }

    /* Story river: the note card */
    #main { flex: 1; min-width: 0; padding: 40px 28px 40px 42px; }
    .tiddler {
      background: var(--card); border-radius: 2px; padding: 42px 56px 48px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }
    .tiddler-head { display: flex; align-items: flex-start; gap: 16px; }
    .tiddler-sub { color: var(--faint); margin: 2px 0 22px; min-height: 1.5em; }
    .title-input {
      flex: 1; min-width: 0; background: transparent; outline: none;
      font: inherit; font-size: 2.35em; line-height: 1.25; font-weight: 400; color: var(--title);
      border: 1px solid transparent; border-radius: 3px; padding: 0 8px; margin-left: -9px;
    }
    .title-input[readonly] { cursor: default; color: var(--muted); }
    /* Edit mode: framed like the content editor. Both boxes sit 9px left of the
       content edge (1px border + 8px padding), so their borders line up and the
       text stays where it is in view mode. */
    .title-input:not([readonly]) { background: #fff; border-color: var(--rule); }
    .title-input:not([readonly]):focus { border-color: var(--focus); }
    .tiddler-controls { display: flex; gap: 6px; padding-top: 6px; }

    /* Icon buttons (pencil, trash, plus, check) */
    .icon-btn {
      background: none; border: none; cursor: pointer; padding: 4px; line-height: 0;
      color: var(--faint); border-radius: 3px;
    }
    .icon-btn:hover { color: #666; }
    .icon-btn svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    #edit-btn .ic-done { display: none; }
    #edit-btn.editing .ic-edit { display: none; }
    #edit-btn.editing .ic-done { display: inline; }

    #viewer { font-size: 1.05em; line-height: 1.65; overflow-wrap: anywhere; }
    #viewer h1 { font-size: 1.6em; font-weight: 400; color: var(--title); line-height: 1.3; }
    #viewer h2 { font-size: 1.3em; font-weight: 400; color: var(--title); line-height: 1.3; }
    #viewer h1 + br, #viewer h2 + br, #viewer hr + br { display: none; } /* block already ends the line */
    #viewer hr { border: none; border-top: 1px solid #999; margin: 0.6em 0; }
    #viewer code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.88em; background: #f2f2f2; border-radius: 3px; padding: 0.1em 0.35em; }
    #viewer pre { background: #f6f6f6; border: 1px solid #e4e4e4; border-radius: 3px; padding: 8px 12px; margin: 0.3em 0; overflow-x: auto; line-height: 1.45; }
    #viewer pre code { background: none; padding: 0; }
    #viewer pre + br { display: none; } /* the block already ends the line */
    #editor {
      display: none; width: calc(100% + 18px); margin: 0 -9px; min-height: 420px; resize: vertical;
      font: 13.5px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--text);

    .footer { color: var(--faint); font-size: 0.8em; margin-top: 14px; padding-left: 4px; }

    /* Sidebar */
    #sidebar {
      width: calc(var(--side-col) + 42px); flex-shrink: 0; position: sticky; top: 0; max-height: 100vh;
      display: flex; flex-direction: column; padding: 36px 28px 24px 14px; color: #666;
    }
    /* One shared column: controls, tags, search and list all end at the same right edge */
    #sidebar > * { width: 100%; max-width: var(--side-col); }
    #sidebar > .page-controls { width: calc(100% + 4px); max-width: calc(var(--side-col) + 4px); } /* offsets its -4px left margin */
    .page-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px -4px; }
    .export-btn { background: none; border: none; cursor: pointer; padding: 4px 0; font-size: 0.95em; color: var(--muted); }
    .export-btn:hover { color: var(--text); }
    .export-btn.dirty { color: #d23c3c; }
    .export-btn.dirty:hover { color: #a82020; }
    .page-controls .icon-btn svg { width: 32px; height: 32px; color: #999; }

    #search {
      font: inherit; font-size: 0.85em; color: var(--text); background: #fff;
      border: 1px solid var(--rule); border-radius: 4px; padding: 3px 7px; outline: none; margin-bottom: 10px;
    }
    #search:focus { border-color: var(--focus); box-shadow: 0 0 0 2px rgba(87, 120, 216, 0.35); }

    .tag-cloud { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .tag-none { font-size: 0.85em; color: var(--muted); }
    .tag-reset { font-size: 1.15em; line-height: 1; padding: 0 4px; color: var(--muted); cursor: pointer; user-select: none; }
    .tag-reset:hover { color: var(--text); }
    .tag-btn {
      font-size: 0.85em; padding: 1px 9px; border-radius: 10px; cursor: pointer; user-select: none;
      background: var(--tab); color: #555; border: 1px solid transparent;
    }
    .tag-btn:hover { border-color: var(--rule); }
    .tag-btn.active { background: var(--link); color: #fff; }

    #note-list {
      list-style: none; overflow-y: auto; flex: 1; min-height: 0;
      border-left: 1px solid var(--rule); padding-left: 28px;
    }
    #note-list li { font-size: 1.15em; line-height: 1.75; cursor: pointer; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #note-list li:hover { color: var(--link); }
    #note-list li.active { color: var(--link); }

    /* Narrow screens: sidebar goes below the note, like a single column */
    @media (max-width: 900px) {
      body { flex-direction: column; align-items: stretch; }
      #main { flex: none; padding: 16px; }
      .tiddler { padding: 24px 20px 28px; }
      .title-input { font-size: 1.9em; }
      #sidebar { width: auto; position: static; max-height: none; padding: 8px 16px 32px; }
      #note-list { max-height: none; }
    }
  </style>

<body>

  <main id="main">
    <div class="tiddler">
      <div class="tiddler-head">
        <input type="text" id="title-input" class="title-input" placeholder="Title" data-l10n-placeholder="titlePlaceholder" readonly="" oninput="saveCurrentNote()">
        <div class="tiddler-controls">
          <button id="edit-btn" class="icon-btn" title="Edit" data-l10n-title="edit" onclick="toggleEdit()"><svg class="ic-edit" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"></path><path d="M13.5 6.5l4 4"></path></svg><svg class="ic-done" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"></path></svg></button>
          <button class="icon-btn" title="Delete" data-l10n-title="delete" onclick="deleteCurrentNote()"><svg viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 10.5v6M14 10.5v6"></path></svg></button>

    </div>

    <input type="text" id="search" placeholder="Search" data-l10n-placeholder="searchPlaceholder" oninput="renderList()">

    <div class="tag-cloud" id="tag-cloud"></div>

    <ul id="note-list"></ul>
  </aside>

  <script>
    // === UI STRINGS: translate here ===
    // Every interface string lives in this one object. "{name}" marks a value
    // filled in at runtime; keep it, but move it anywhere in the sentence.
    // English text in the HTML below is only a fallback and is replaced on load.
    const STRINGS = {
      lang: 'en',
      appTitle: 'TiddlyWiki Slim',
      footer: '© 2026 TiddlyWiki Slim. MIT License',
      titlePlaceholder: 'Title',
      editorPlaceholder: 'Write markdown, #tags, and [[WikiLinks]]...',
      searchPlaceholder: 'Search',
      edit: 'Edit',
      done: 'Done',
      delete: 'Delete',
      newNote: 'New note',
      export: 'Export',
      exportHint: 'Download this wiki as HTML',
      exportHintDirty: 'Unsaved changes: download this wiki as HTML',
      clearTags: 'Clear tag filter',
      noTags: 'Tags will be shown here',
      confirmDelete: 'Delete note "{title}"?',
      cannotDeleteLast: 'Cannot delete the last note.',
      untitled: 'Untitled',
      newNoteTitle: 'Untitled Tiddler',
      newNoteContent: '# New Note\n\nStart writing... #draft',
      linkNoteContent: '# {title}\n\nCreated via WikiLink.',
      indexTitle: 'Index',
      indexContent: '# Start page of this wiki\nLink your main notes here',
    };

    // t('confirmDelete', { title: 'X' }) -> 'Delete note "X"?'
    const t = (key, vars = {}) =>
      (STRINGS[key] ?? key).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));

    // Fills HTML marked with data-l10n (text), data-l10n-title, data-l10n-placeholder.
    // Runs after the export snapshot is taken, so saved files keep the keys, not the text.
    function applyStrings() {
      document.documentElement.lang = STRINGS.lang;
      document.title = t('appTitle');
      document.querySelectorAll('[data-l10n]').forEach(el => { el.textContent = t(el.dataset.l10n); });
      for (const attr of ['title', 'placeholder']) {
        document.querySelectorAll(`[data-l10n-${attr}]`)
          .forEach(el => el.setAttribute(attr, t(el.getAttribute(`data-l10n-${attr}`))));
      }
    }

    // === VAULT (the page is its own database) ===
    // Notes live as XML text inside <script id="twslim-vault" type="application/xml">,
    // placed at the top of <head> right after <meta charset> (the charset tag must
    // stay within the first 1024 bytes, or browsers may guess the encoding wrong).
    // Script content is raw text to the HTML parser, so it round-trips byte-for-byte
    // through outerHTML
    const VAULT_ID = 'twslim-vault';
    const DEFAULT_FILENAME = 'slim-wiki.html';

    // Snapshot of the page taken before any rendering (see init at the bottom).
    // Exports are built from it, so runtime DOM (list items, viewer HTML,
    // inline styles) never leaks into the file, and the vault keeps its place.
    let pristineRoot = null;

    function childText(el, name) {
      const c = Array.from(el.children).find(e => e.localName === name);
      return c ? c.textContent : '';
    }

    // Raw text of an element, keeping any markup inside it. Note content is
    // normally CDATA (plain text), but hand-edited files may hold raw HTML tags
    // such as <u>, which the XML parser would otherwise turn into elements.
    function childMarkup(el, name) {
      const c = Array.from(el.children).find(e => e.localName === name);
      if (!c) return '';
      return Array.from(c.childNodes).map(node => node.nodeType === Node.ELEMENT_NODE
        ? new XMLSerializer().serializeToString(node) : node.textContent).join('');
    }

    function loadVault(el) {
      const xml = new DOMParser().parseFromString(el.textContent.trim(), 'application/xml');
      const err = xml.getElementsByTagName('parsererror')[0];
      if (err) throw new Error('Vault XML is malformed: ' + err.textContent);
      return Array.from(xml.documentElement.children)
        .filter(e => e.localName === 'note')
        .map(n => ({
          id: n.getAttribute('id'),
          updated: n.getAttribute('updated') || '',
          title: childText(n, 'title'),
          content: childMarkup(n, 'content').trim()
        }));
    }

    // Note content goes in CDATA, so HTML and markdown stay readable in the file.
    // CDATA can't contain "]]>", and inside the vault <script> the HTML parser
    // must never see "</script" or "<!--"; each is split across two CDATA sections.
    function cdata(s) {
      s = String(s)
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\uFFFE\uFFFF]/g, '') // not representable in XML 1.0
        .replace(/\r\n?/g, '\n')
        .replace(/]]>/g, ']]]]><![CDATA[>')
        .replace(/<(?=\/script|!--)/gi, '<]]><![CDATA[');
      return '<![CDATA[\n' + s + '\n]]>';
    }

    function xmlEscape(s, attr) {
      s = String(s)
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\uFFFE\uFFFF]/g, '') // not representable in XML 1.0
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\r/g, '&#13;'); // the XML parser would otherwise fold \r into \n
      return attr ? s.replace(/"/g, '&quot;').replace(/\n/g, '&#10;').replace(/\t/g, '&#9;') : s;
    }

	// === EXPORT/IMPORT ===
    // Stable file order: title A→Z (case-insensitive), then newest "updated" first,
    // then id. Plain code-point comparison, not localeCompare, so every browser
    // and system locale writes the same order.
    const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
    function fileOrder(a, b) {
      return cmp(a.title.toLowerCase(), b.title.toLowerCase())
        || cmp(a.title, b.title)
        || (Date.parse(b.updated) || 0) - (Date.parse(a.updated) || 0)
        || cmp(a.id, b.id);
    }

    // Canonical form: loading this and serializing again yields the identical string.
    // Content goes on its own lines; it is trimmed here and on load, so stray
    // leading/trailing whitespace from the editor can't make exports drift.
    function serializeVault(notes) {
      return '\n<vault version="1">\n\n' + [...notes].sort(fileOrder).map(n =>
        `<note id="${xmlEscape(n.id, true)}" updated="${xmlEscape(n.updated || '', true)}">\n` +
        `<title>${xmlEscape(n.title)}</title>\n` +
        `<content>${cdata(n.content.trim())}</content>\n` +
        `</note>\n\n`).join('') + '</vault>\n  ';
    }

    // Name of the file currently open (file:// or http path), sanitized; else a default.
    function exportFilename(loc = location) {
      let name = '';
      if (/^(file|https?):$/.test(loc.protocol)) {
        try { name = decodeURIComponent(loc.pathname.split('/').pop() || ''); } catch (e) { name = ''; }
      }
      name = name
        .replace(/[<>:"\/\\|?*\x00-\x1F\x7F]/g, '_') // invalid on Windows/macOS/Linux
        .replace(/^[\s.]+|[\s.]+$/g, '') // no leading/trailing dots or spaces
        .slice(0, 200);
      if (!name || /^_*$/.test(name)) return DEFAULT_FILENAME;
      if (!/\.html?$/i.test(name)) name += '.html';
      return name;
    }

    function buildExportHtml() {
      const root = pristineRoot.cloneNode(true);
      root.querySelector('#' + VAULT_ID).textContent = serializeVault(db);
      return '<!DOCTYPE html>\n' + root.outerHTML;
    }

    function downloadSelf() {
      const blob = new Blob([buildExportHtml()], { type: "text/html" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = exportFilename();
      document.body.appendChild(a); // some Firefox/Safari versions ignore clicks on detached links
      a.click();
      a.remove();
      savedSignature = changeSignature();
      updateExportState();
    }

    // === CORE STATE ===
    let db = loadVault(document.getElementById(VAULT_ID));

    // Unsaved-changes tracking: the set of (id, updated) pairs as of the last
    // load/export. Any edit, new note or deletion changes it, and Export turns red.
    const changeSignature = () => db.map(n => n.id + '\u0000' + n.updated).sort().join('\n');
    let savedSignature = changeSignature(); // taken before .index may be auto-created

    // "updated" is stored as ISO 8601 UTC, e.g. 2026-11-25T21:40:00Z
    const nowIso = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
    const timeOf = n => Date.parse(n.updated) || 0;
    const byRecent = () => [...db].sort((a, b) => timeOf(b) - timeOf(a));

    // Browser's default date+time format for the user's locale, in local time
    function formatUpdated(iso) {
      const d = new Date(iso);
      return !iso || isNaN(d) ? '' : d.toLocaleString();
    }

    // Start page: always opened on load, and recreated on load
    // if missing. It is otherwise a normal note (rename/delete freely).
    // Found by its fixed id, so the title can be anything.
    const INDEX_ID = '.index';
    function ensureIndexNote() {
      let note = db.find(n => n.id === INDEX_ID);
      if (!note) {
        note = { id: INDEX_ID, updated: nowIso(), title: t('indexTitle'), content: t('indexContent') };
        db.unshift(note);
      }
      return note;
    }

    let currentId = ensureIndexNote().id;
    let selectedTags = new Set();
    let isEditing = false;

    const listEl = document.getElementById('note-list');
    const tagCloudEl = document.getElementById('tag-cloud');
    const titleEl = document.getElementById('title-input');
    const editorEl = document.getElementById('editor');
    const viewerEl = document.getElementById('viewer');
    const subEl = document.getElementById('note-sub');
    const exportBtn = document.getElementById('export-btn');

    // #tag, #this-is-tag, #this_is_also_tag; a hyphen only between word chars,
    // so "#tag-" or "#tag - text" stops before the dash
    const TAG_RE = /#[\w가-힣]+(?:-[\w가-힣]+)*/g;
    const CODE_BLOCK_RE = /^```[^\n]*\n([\s\S]*?)^```[ \t]*$/gm; // ```lang ... ``` on their own lines
    const INLINE_CODE_RE = /`([^`\n]+)`/g;
    const escHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // Tags of a note, ignoring anything written inside code
    const tagsOf = text => text.replace(CODE_BLOCK_RE, '').replace(INLINE_CODE_RE, '').match(TAG_RE) || [];

    function parseMarkdown(text) {
      if (!text) return "";
      // Code is set aside first, so none of the rules below touch it, and put
      // back (HTML-escaped) at the very end. Placeholders use private-use chars.
      const stash = [];
      const keep = html => `\uE000${stash.push(html) - 1}\uE001`;
      return text
        .replace(CODE_BLOCK_RE, (m, code) => keep(`<pre><code>${escHtml(code.replace(/\n$/, ''))}</code></pre>`))
        .replace(INLINE_CODE_RE, (m, code) => keep(`<code>${escHtml(code)}</code>`))
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^\* (.*$)/gim, '• $1')                   // bullets first: their "* " is not emphasis
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')   // bold before italic, so ** isn't split
        .replace(/\*([^*\s](?:[^*\n]*[^*\s])?)\*/g, '<i>$1</i>') // *x* but not "a * b * c"
        .replace(/^---$/gm, '<hr>')
        // Finished links are set aside too, so a #anchor in the address isn't taken for a tag
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s]+)\)/g, (m, label, url) =>
          keep(`<a href="${url.replace(/"/g, '%22')}" target="_blank" class="ext-link">${label}</a>`))
        .replace(TAG_RE, '<span class="wiki-tag">$&</span>')
        .replace(/\[\[(.*?)\]\]/g, (m, target) => `<span class="wiki-link" onclick="navigateTo('${target}')">${target}</span>`)
        .replace(/\n/g, '<br>')
        .replace(/\uE000(\d+)\uE001/g, (m, i) => stash[i]);
    }

    function loadNote(id) {
      currentId = id;
      const note = db.find(n => n.id === id);
      if (!note) return;

      titleEl.value = note.title;
      editorEl.value = note.content;
      subEl.textContent = formatUpdated(note.updated);
      viewerEl.innerHTML = parseMarkdown(note.content);
      renderList();
    }

    function toggleTagFilter(tag) {
      if (selectedTags.has(tag)) {
        selectedTags.delete(tag);
      } else {
        selectedTags.add(tag);
      }
      renderList();
    }

    function resetTags() {
      selectedTags.clear();
      renderList();
    }

    function renderList() {
      const search = document.getElementById('search').value.toLowerCase();
      listEl.innerHTML = "";
      
      const allTags = new Set();
      db.forEach(n => tagsOf(n.content).forEach(t => allTags.add(t)));
      
      tagCloudEl.innerHTML = "";
      [...allTags].sort((a, b) => cmp(a.toLowerCase(), b.toLowerCase()) || cmp(a, b)).forEach(tag => {
        const btn = document.createElement('span');
        const isActive = selectedTags.has(tag);
        btn.className = `tag-btn ${isActive ? 'active' : ''}`;
        btn.textContent = tag;
        btn.onclick = () => toggleTagFilter(tag);
        tagCloudEl.appendChild(btn);
      });
      if (allTags.size) {
        const x = document.createElement('span');
        x.className = 'tag-reset';
        x.textContent = '×';
        x.title = t('clearTags');
        x.onclick = resetTags;
        tagCloudEl.appendChild(x);
      } else {
        const none = document.createElement('span');
        none.className = 'tag-none';
        none.textContent = t('noTags');
        tagCloudEl.appendChild(none);
      }

      byRecent().filter(n => {
        const matchSearch = n.title.toLowerCase().includes(search) || n.content.toLowerCase().includes(search);
        const noteTags = tagsOf(n.content);
        const matchTags = Array.from(selectedTags).every(st => noteTags.includes(st));

        return matchSearch && matchTags;
      }).forEach(note => {
        const li = document.createElement('li');
        li.className = note.id === currentId ? 'active' : '';
        li.innerHTML = `<span>${note.title}</span>`;
        li.onclick = () => loadNote(note.id);
        listEl.appendChild(li);
      });
      updateExportState(); // every change path ends in renderList()
    }

    const hasUnsavedChanges = () => changeSignature() !== savedSignature;

    // Browser's own "Leave page?" prompt (its text can't be customised).
    window.addEventListener('beforeunload', e => {
      if (hasUnsavedChanges()) { e.preventDefault(); e.returnValue = ''; }
    });

    function updateExportState() {
      const dirty = hasUnsavedChanges();
      exportBtn.classList.toggle('dirty', dirty);
      exportBtn.title = t(dirty ? 'exportHintDirty' : 'exportHint');
    }

    function saveCurrentNote() {
      const note = db.find(n => n.id === currentId);
      if (note) {
        note.title = titleEl.value;
        note.content = editorEl.value;
        note.updated = nowIso();
        subEl.textContent = formatUpdated(note.updated);
        viewerEl.innerHTML = parseMarkdown(note.content);
        renderList();
      }
    }

    function toggleEdit() {
      isEditing = !isEditing;
      editorEl.style.display = isEditing ? 'block' : 'none';
      viewerEl.style.display = isEditing ? 'none' : 'block';
      const editBtn = document.getElementById('edit-btn');
      editBtn.classList.toggle('editing', isEditing); // swaps pencil / check icon via CSS
      editBtn.title = t(isEditing ? 'done' : 'edit');
      titleEl.readOnly = !isEditing;
      if (isEditing) editorEl.focus();
    }

    function createNewNote() {
      const newNote = { id: 'note_' + Date.now(), updated: nowIso(), title: t('newNoteTitle'), content: t('newNoteContent') };
      db.unshift(newNote);
      loadNote(newNote.id);
      if (!isEditing) toggleEdit();
    }

    function deleteCurrentNote() {
      const note = db.find(n => n.id === currentId);
      if (!note) return;
      if (db.length <= 1) return alert(t('cannotDeleteLast'));
      if (!confirm(t('confirmDelete', { title: note.title || t('untitled') }))) return;
      db = db.filter(n => n.id !== currentId);
      // Next: the index note if it still exists, else the most recently updated one
      loadNote((db.find(n => n.id === INDEX_ID) || byRecent()[0]).id);
    }

    function navigateTo(title) {
      let target = db.find(n => n.title.toLowerCase() === title.toLowerCase());
      if (!target) {
        target = { id: 'note_' + Date.now(), updated: nowIso(), title: title, content: t('linkNoteContent', { title }) };
        db.unshift(target);
      }
      loadNote(target.id);
    }

    // Wait for the parser to finish so the snapshot includes everything after
    // this script (whitespace, any markup added below), then render.
    document.addEventListener('DOMContentLoaded', () => {
      pristineRoot = document.documentElement.cloneNode(true);
      applyStrings();
      loadNote(currentId);
    });
  </script>
  
</body></html>
